# Nginx config for bravelilystudio.com on EC2
# 1. Build the frontend: cd frontend && yarn build
# 2. Copy the build folder to /var/www/bravelily (or change root below to your build path)
# 3. Place this file at /etc/nginx/sites-available/bravelily and symlink to sites-enabled
# 4. Run: sudo certbot --nginx -d bravelilystudio.com -d www.bravelilystudio.com (adds HTTPS)

server {
    listen 80;
    server_name bravelilystudio.com www.bravelilystudio.com;

    root /var/www/bravelily;
    index index.html;

    location /api/ {
        # IMPORTANT: no trailing slash on proxy_pass. A trailing slash
        # (http://127.0.0.1:8001/) strips the /api prefix and causes 404s.
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
